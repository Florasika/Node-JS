<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mini Blog JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>📝 Mini Blog</h1>

  <div class="container">
    
    <!-- Formulaire -->
    <div class="form">
      <input type="text" id="title" placeholder="Titre">
      <textarea id="content" placeholder="Contenu (Markdown supporté)"></textarea>
      <button id="addPost">Publier</button>
    </div>

    <!-- Liste des articles -->
    <div id="posts"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>

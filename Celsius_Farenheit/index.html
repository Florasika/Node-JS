<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Convertisseur Température</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌡️ Convertisseur</h1>

        <input type="number" id="inputTemp" placeholder="Entrez une température">

        <select id="unit">
            <option value="cToF">Celsius → Fahrenheit</option>
            <option value="fToC">Fahrenheit → Celsius</option>
        </select>

        <button id="convertBtn">Convertir</button>

        <p id="result"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>App Météo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🌤️ Météo</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Entrez une ville...">
      <button id="searchBtn">Rechercher</button>
    </div>

    <div id="weatherResult" class="weather-card hidden">
      <h2 id="cityName"></h2>
      <p id="temperature"></p>
      <p id="description"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
